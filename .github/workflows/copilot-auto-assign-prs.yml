name: Copilot pull request automation

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  automate:
    runs-on: ubuntu-latest
    steps:
      - name: Assign, review, and auto-merge with Copilot
        uses: actions/github-script@v8
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pull_number = context.payload.pull_request.number;
            const currentAssignees = (context.payload.pull_request.assignees || []).map(({ login }) => login.toLowerCase());

            if (!currentAssignees.includes('copilot')) {
              await github.rest.issues.addAssignees({
                owner,
                repo,
                issue_number: pull_number,
                assignees: ['Copilot'],
              });
              core.info('Assigned Copilot to the pull request.');
            } else {
              core.info('Copilot is already assigned to the pull request.');
            }

            try {
              await github.rest.pulls.requestReviewers({
                owner,
                repo,
                pull_number,
                reviewers: ['Copilot'],
              });
              core.info('Requested a Copilot review.');
            } catch (error) {
              if (error.status === 422) {
                core.info(`Review request skipped: ${error.message}`);
              } else {
                throw error;
              }
            }

            if (context.payload.pull_request.draft) {
              core.info('Draft pull request: skipping auto-merge until it is ready for review.');
              return;
            }

            const pr = await github.rest.pulls.get({ owner, repo, pull_number });
            if (pr.data.auto_merge) {
              core.info('Auto-merge is already enabled.');
              return;
            }

            try {
              await github.graphql(
                `mutation EnableAutoMerge($pullRequestId: ID!) {
                  enablePullRequestAutoMerge(input: { pullRequestId: $pullRequestId, mergeMethod: SQUASH }) {
                    pullRequest {
                      number
                    }
                  }
                }`,
                { pullRequestId: pr.data.node_id },
              );
              core.info('Enabled auto-merge with squash.');
            } catch (error) {
              // A PR whose checks are still running comes back as
              // "Pull request is in unstable status" (UNPROCESSABLE), and a PR with a
              // pending required review comes back as "Pull request is in blocked status".
              // Both mean "ask again after the next push", not "this workflow is broken" —
              // failing the job here puts a red X on every PR in the repo and, worse,
              // blocks any merge loop that gates on a green check run.
              core.warning(`Auto-merge not armed for PR #${pull_number}: ${error.message}`);
            }
