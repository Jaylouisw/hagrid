name: Copilot issue auto-assign

# Optional in-repo path for assigning new issues to the Copilot cloud agent.
#
# This workflow's own GITHUB_TOKEN cannot call the agent-assignment API: it returns
# `403 Forbidden` (verified on issue #23, run 35576777773). So the job only acts when a
# repository secret named COPILOT_ASSIGN_TOKEN exists — a user token allowed to assign
# Copilot. Without it the job logs and exits cleanly instead of failing red.
#
# Assignment runs today via the local watcher on ultron:
#   /home/jay/copilot-automation/copilot_automation.py   (Hermes cron, every 10 minutes)

on:
  issues:
    types: [opened, reopened]

permissions:
  issues: write

jobs:
  assign:
    if: ${{ github.event.issue.pull_request == null && github.actor != 'Copilot' }}
    runs-on: ubuntu-latest
    steps:
      - name: Assign the issue to Copilot
        env:
          ASSIGN_TOKEN: ${{ secrets.COPILOT_ASSIGN_TOKEN }}
        run: |
          if [ -z "$ASSIGN_TOKEN" ]; then
            echo "COPILOT_ASSIGN_TOKEN is not set, so this in-repo path stays dormant."
            echo "Copilot assignment is handled by the local watcher on ultron."
            exit 0
          fi

          GH_TOKEN="$ASSIGN_TOKEN" gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${{ github.repository }}/issues/${{ github.event.issue.number }}/assignees" \
            --input - <<JSON
          {
            "assignees": ["copilot-swe-agent[bot]"],
            "agent_assignment": {
              "target_repo": "${{ github.repository }}",
              "base_branch": "${{ github.event.repository.default_branch }}",
              "custom_instructions": "",
              "custom_agent": "",
              "model": ""
            }
          }
          JSON
