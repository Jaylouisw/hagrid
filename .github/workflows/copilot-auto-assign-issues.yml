name: Copilot issue auto-assign

on:
  issues:
    types: [opened, reopened]

permissions:
  issues: write

jobs:
  assign:
    if: ${{ github.event.issue.pull_request == null && github.actor != 'Copilot' }}
    runs-on: ubuntu-latest
    steps:
      - name: Assign the issue to Copilot
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue edit "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --add-assignee Copilot
