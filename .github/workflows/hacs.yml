name: HACS

# HACS reads the repository, not the code: it wants custom_components/ at the root, a release to
# install from, and a repository it can present in the store. The 1.0.0 bug was exactly this layer
# (a nested layout HACS could never see), so it gets its own check rather than being assumed.

on:
  push:
    branches: [main]
    paths:
      - "custom_components/**"
      - "hacs.json"
      - "README.md"
      - ".github/workflows/hacs.yml"
  pull_request:
    paths:
      - "custom_components/**"
      - "hacs.json"
      - "README.md"
      - ".github/workflows/hacs.yml"
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # v7
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Run HACS validation
        # main
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa
        with:
         category: integration
