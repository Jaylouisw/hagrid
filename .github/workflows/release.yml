name: CD

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: Build release package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build HACS package
        run: |
          set -euo pipefail
          package_paths=("custom_components/hagrid")
          if [ -d "www/hagrid-map" ]; then
            package_paths+=("www/hagrid-map")
          fi
          zip -r hagrid.zip "${package_paths[@]}"
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: hagrid-release-package
          path: hagrid.zip
      - name: Attach package to GitHub release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
        with:
          files: hagrid.zip
