name: CD

on:
  release:
    types: [published]

permissions:
  # Default to read; publish job elevates to contents:write only where required.
  contents: read

jobs:
  package:
    name: Build release package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # v4.4.0
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Build HACS package
        run: |
          set -euo pipefail
          package_paths=("custom_components/hagrid")
          if [ -d "www/hagrid-map" ]; then
            package_paths+=("www/hagrid-map")
          fi
          zip -r hagrid.zip "${package_paths[@]}"
      - name: Upload workflow artifact
        # v4.6.2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hagrid-release-package
          path: hagrid.zip

  publish:
    name: Publish release asset
    runs-on: ubuntu-latest
    needs: package
    permissions:
      contents: write
    steps:
      - name: Download release package
        # v4.1.3 (patches GHSA-pjjv-m4mw-x369)
        uses: actions/download-artifact@87c55149d96e628cc2ef7e6fc2aab372015aec85
        with:
          name: hagrid-release-package
      - name: Attach package to GitHub release
        # v3.0.3
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
        with:
          files: hagrid.zip
