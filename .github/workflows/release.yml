name: CD

on:
  release:
    types: [published]

permissions:
  # Default to read; publish job elevates to contents:write only where required.
  contents: read

jobs:
  package:
    name: Build release package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build HACS package
        run: |
          set -euo pipefail
          package_paths=("custom_components/hagrid")
          if [ -d "www/hagrid-map" ]; then
            package_paths+=("www/hagrid-map")
          fi
          zip -r hagrid.zip "${package_paths[@]}"
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: hagrid-release-package
          path: hagrid.zip

  publish:
    name: Publish release asset
    runs-on: ubuntu-latest
    needs: package
    permissions:
      contents: write
    steps:
      - name: Download release package
        uses: actions/download-artifact@v4
        with:
          name: hagrid-release-package
      - name: Attach package to GitHub release
        # v3.0.3
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
        with:
          files: hagrid.zip
