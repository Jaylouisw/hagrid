name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # v4.4.0
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Run HACS validation
        # 22.5.0
        uses: hacs/action@d556e736723344f83838d08488c983a15381059a
        with:
          category: integration

  hassfest:
    name: Home Assistant metadata validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # v4.4.0
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Run hassfest
        # home-assistant/actions commit 58bff37
        uses: home-assistant/actions/hassfest@58bff37c8947f690ace498be413a9b78d6f30f93

  tests:
    name: Import and registration tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - name: Checkout
        # v4.4.0
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Python
        # v5.6.0
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements_test.txt
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements_test.txt
      - name: Show Home Assistant version under test
        run: python -c "from homeassistant.const import __version__; print('homeassistant', __version__)"
      - name: Run tests
        run: python -m pytest -q tests/
